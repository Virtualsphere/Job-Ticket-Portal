<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Ticket Portal — Dashboard</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">🛠️ Job Ticket Portal</div>
    <div style="display:flex; align-items:center;">
      <span class="who" id="whoami"></span>
      <button id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="container">

    <!-- Admin: manage roles -->
    <div class="panel" id="rolesPanel" style="display:none;">
      <h2>Roles</h2>
      <div id="rolesList" class="role-chips"></div>
      <form id="createRoleForm" class="inline-form">
        <input type="text" id="newRoleName" placeholder="e.g. quality_inspector" required />
        <input type="text" id="newRoleDesc" placeholder="Description (optional)" />
        <button class="btn-secondary" type="submit">Add Role</button>
      </form>
    </div>

    <!-- Admin: create user accounts -->
    <div class="panel" id="createUserPanel" style="display:none;">
      <h2>Create User Account</h2>
      <form id="createUserForm">
        <div class="grid-2">
          <div>
            <label>Full Name</label>
            <input type="text" id="newUserName" required placeholder="Jane Doe" />
          </div>
          <div>
            <label>Email</label>
            <input type="email" id="newUserEmail" required placeholder="jane@example.com" />
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label>Temporary Password</label>
            <div class="password-field">
              <input type="password" id="newUserPassword" required placeholder="At least 6 characters" minlength="6" />
              <button type="button" class="icon-btn" id="toggleNewUserPassword" title="Show password" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path class="eye-open" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                  <circle class="eye-open" cx="12" cy="12" r="3"></circle>
                  <path class="eye-closed" style="display:none" d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 4.22-5.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <path class="eye-closed" style="display:none" d="M1 1l22 22"></path>
                </svg>
              </button>
              <button type="button" class="icon-btn" id="generateNewUserPassword" title="Generate password" aria-label="Generate password">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 2v6h-6"></path>
                  <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                  <path d="M3 22v-6h6"></path>
                  <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                </svg>
              </button>
            </div>
          </div>
          <div>
            <label>Role</label>
            <select id="newUserRole" required><option value="">Select role…</option></select>
          </div>
        </div>
        <button class="btn-primary" type="submit">Create Account</button>
      </form>
    </div>

    <!-- Admin / Production Manager: create job -->
    <div class="panel" id="createJobPanel" style="display:none;">
      <h2>Create a New Job</h2>
      <form id="createJobForm">
        <div class="grid-2">
          <div>
            <label>Job Title</label>
            <input type="text" id="jobTitle" required placeholder="e.g. Custom Steel Bracket Batch" />
          </div>
          <div>
            <label>Customer</label>
            <div class="autocomplete-wrap">
              <input type="text" id="jobCustomerInput" autocomplete="off" required placeholder="Type customer name or email…" />
              <input type="hidden" id="jobCustomerId" />
              <div class="autocomplete-list" id="jobCustomerList"></div>
            </div>
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label>Engineers (optional)</label>
            <select id="jobEngineerIds" multiple size="4"><option value="" disabled>Loading engineers…</option></select>
            <div style="font-size:12px; color:var(--muted); margin-top:4px;">Hold Ctrl (Cmd on Mac) to select multiple.</div>
          </div>
          <div id="jobPmField" style="display:none;">
            <label>Production Manager (optional)</label>
            <select id="jobPmSelect"><option value="">Unassigned</option></select>
          </div>
        </div>
        <label>Description</label>
        <textarea id="jobDescription" placeholder="What needs to be produced?"></textarea>
        <label>Materials</label>
        <div id="materialsList"></div>
        <button type="button" class="btn-secondary" id="addMaterialBtn">+ Add Material</button>
        <div class="grid-2">
          <div>
            <label>Priority</label>
            <select id="pdPriority">
              <option>Low</option>
              <option selected>Normal</option>
              <option>High</option>
              <option>Urgent</option>
            </select>
          </div>
          <div>
            <label>Deadline</label>
            <input type="date" id="pdDeadline" />
          </div>
        </div>
        <label>Production Specifications / Notes</label>
        <textarea id="pdSpecs" placeholder="Tolerances, finish, packaging, etc."></textarea>
        <label>Attach Documents (BRD, drawings, etc.)</label>
        <input type="file" id="jobDocuments" multiple />
        <button class="btn-primary" type="submit">Create Job Ticket</button>
      </form>
    </div>

    <!-- Job list -->
    <div class="panel">
      <h2 id="jobsHeading">Jobs</h2>
      <div id="jobsList"><div class="empty-state">Loading…</div></div>
    </div>
  </div>

  <!-- Job detail modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalCloseBtn">✕</button>
      <h2 id="modalTitle">Job Detail</h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toastHost"></div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
